<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtZoneJogja</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #444;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: url('https://source.unsplash.com/featured/?tshirt') center/cover no-repeat;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      padding: 0 15px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .btn {
      margin-top: 10px;
      display: inline-block;
      padding: 10px 20px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    form {
      max-width: 500px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    footer {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
    }

    @media (max-width: 768px) {
      .hero {
        font-size: 1.5rem;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ArtZoneJogja</h1>
    <p>Screen Printed T-Shirts | Sablon Kustom</p>
  </header>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="produk.html">Produk</a>
    <a href="kualitas.html">Kualitas</a>
    <a href="testimoni.html">Testimoni</a>
    <a href="kontak.html">Kontak</a>
  </nav>

  <div class="hero">
    Ekspresikan Gaya Lewat Kaos Kustom!
  </div>

  <section class="section">
    <h2>Selamat Datang di ArtZoneJogja</h2>
    <p>Temukan kaos sablon kustom terbaik untuk gaya unikmu!</p>
    <a href="produk.html" class="btn">Lihat Produk</a>
  </section>

  <section class="section">
    <h2>Hubungi Kami</h2>
    <form action="mailto:youremail@example.com" method="POST" enctype="text/plain">
      <input type="text" name="nama" placeholder="Nama" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="pesan" rows="5" placeholder="Pesan Anda..." required></textarea>
      <button type="submit">KIRIM</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 ArtZoneJogja. All Rights Reserved.</p>
  </footer>
</body>
</html>
